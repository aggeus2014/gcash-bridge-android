name: Build LiveSelling GCash Bridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSelling-GCash-Bridge
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: release-${{ github.run_number }}
          name: LiveSelling GCash Bridge v1.0.${{ github.run_number }}
          body: |
            ### 📱 LiveSelling GCash Mobile Payment Bridge
            - Automated push notification listener for `com.globe.gcash.android`
            - Extracts: PHP Amount, Sender Name, 10-14 digit Ref Number, and Timestamp
            - Offline SQLite queue with auto-sync retry on reconnect
            - **Download:** Tap `app-debug.apk` below on your Android phone to install!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
